<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Playlists — SounAD</title>
<meta name="description" content="Gerencie suas playlists musicais. Crie, organize e adicione faixas do Spotify.">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- NAV -->
<nav class="nav" id="mainNav">
  <a href="../../index.html" class="nav-brand">
    <span class="dot"></span>
    SOUN<span class="ad">AD</span>
  </a>
  <div class="nav-links">
    <a href="../../index.html" class="nav-link"><span>Início</span></a>
    <a href="dashboard.html" class="nav-link active"><span>Playlists</span></a>
    <a href="search.html" class="nav-link"><span>Busca IA</span></a>
  </div>
</nav>

<!-- DECOR -->
<div class="deco" style="top:-10%;right:-12%;width:44vw;min-width:360px;opacity:.22" data-ribbon></div>
<div class="deco" style="bottom:-18%;left:-12%;width:38vw;min-width:320px;opacity:.17" data-ribbon></div>

<div class="page-wrap">
  <main class="main-area">
    <div class="container" style="padding-top:40px; padding-bottom:60px">

      <!-- LIST VIEW -->
      <div id="listView">
        <div class="page-head" id="listHead">
          <div class="page-head-left">
            <h1>Minhas Playlists</h1>
            <p>Crie playlists personalizadas e adicione suas músicas favoritas.</p>
          </div>
          <button class="btn btn-primary" id="openCreateBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nova Playlist
          </button>
        </div>

        <!-- Create Form (collapsible) -->
        <div id="createForm" class="glass-panel" style="padding:22px;margin-bottom:28px;display:none;opacity:0;animation:fadeUp .3s ease forwards">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <h3 style="font-size:16px">Criar nova playlist</h3>
            <button class="btn-icon btn btn-ghost btn-sm" id="closeCreateBtn" type="button">✕</button>
          </div>
          <form id="newPlaylistForm" class="inline-form">
            <input type="text" class="inp" id="playlistName" placeholder="Ex: Lo-fi pra estudar, Treino pesado..." required autocomplete="off">
            <button class="btn btn-primary" type="submit">Criar</button>
          </form>
        </div>

        <!-- Stats bar -->
        <div id="statsBar" style="display:flex;gap:20px;margin-bottom:20px;opacity:0;animation:fadeUp .5s ease .1s forwards">
          <div class="badge badge-purple" id="countBadge">0 playlists</div>
          <div class="badge badge-blue" id="trackCountBadge">0 faixas total</div>
        </div>

        <div id="playlistGrid" class="playlist-grid"></div>
      </div>

      <!-- DETAIL VIEW -->
      <div id="detailView" style="display:none">
        <a class="back-link" href="#" id="backToList">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar para playlists
        </a>

        <div class="page-head" style="opacity:1;animation:none">
          <div class="page-head-left">
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
              <h1 id="detailName" style="max-width:500px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></h1>
              <span id="detailBadge" class="badge badge-purple"></span>
            </div>
            <p id="detailCount" style="color:var(--muted);font-size:14px;margin-top:6px"></p>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <a class="btn btn-ghost btn-sm" href="search.html" id="addTracksBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              Buscar músicas
            </a>
            <button class="btn btn-danger btn-sm" id="deletePlaylistBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              Excluir
            </button>
          </div>
        </div>

        <div class="divider" style="margin-bottom:24px"></div>

        <div id="trackList"></div>
      </div>

    </div>
  </main>
</div>

<footer>
  <div class="foot-brand">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span>SounAD <strong>© 2026</strong></span>
  </div>
  <div class="foot-links">
    <a href="../../index.html">Início</a>
    <a href="dashboard.html">Playlists</a>
    <a href="search.html">Busca IA</a>
  </div>
</footer>

<div class="toast-container" id="toastContainer"></div>

<script src="../js/app.js"></script>
<script>
  /* ====== DASHBOARD LOGIC ====== */
  let currentId = null;
  let currentAudio = null;

  /* Nav scroll effect */
  window.addEventListener('scroll', () => {
    document.getElementById('mainNav').style.background =
      window.scrollY > 10 ? 'rgba(0,0,0,.95)' : 'rgba(0,0,0,.75)';
  });

  /* Create form toggle */
  document.getElementById('openCreateBtn').addEventListener('click', () => {
    const f = document.getElementById('createForm');
    f.style.display = 'block';
    f.style.opacity = '0'; f.style.animation = 'fadeUp .3s ease forwards';
    document.getElementById('openCreateBtn').style.display = 'none';
    setTimeout(() => document.getElementById('playlistName').focus(), 50);
  });
  document.getElementById('closeCreateBtn').addEventListener('click', () => {
    document.getElementById('createForm').style.display = 'none';
    document.getElementById('openCreateBtn').style.display = 'inline-flex';
  });

  /* Playlist grid colors */
  const cardGradients = [
    'linear-gradient(135deg,#1a1060,#0a1a5c)',
    'linear-gradient(135deg,#1a0830,#200d50)',
    'linear-gradient(135deg,#0a2040,#0a1060)',
    'linear-gradient(135deg,#200830,#3d0a5c)',
    'linear-gradient(135deg,#0d3040,#0a2060)',
    'linear-gradient(135deg,#1a1540,#0d0a30)',
  ];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function updateStats() {
    const list = getPlaylists();
    const total = list.reduce((s, p) => s + p.tracks.length, 0);
    document.getElementById('countBadge').textContent = `${list.length} playlist${list.length !== 1 ? 's' : ''}`;
    document.getElementById('trackCountBadge').textContent = `${total} faixa${total !== 1 ? 's' : ''} total`;
  }

  function renderGrid() {
    const grid = document.getElementById('playlistGrid');
    const list = getPlaylists();
    updateStats();
    if (!list.length) {
      grid.innerHTML = `<div style="grid-column:1/-1">
        <div class="empty-state">
          <div class="pulse-ring">🎵</div>
          <strong>Nenhuma playlist ainda</strong>
          <p>Clique em "Nova Playlist" para começar a organizar suas músicas.</p>
          <button class="btn btn-primary" onclick="document.getElementById('openCreateBtn').click()">
            Criar primeira playlist
          </button>
        </div>
      </div>`;
      return;
    }
    grid.innerHTML = list.map((p, i) => {
      const grad = cardGradients[i % cardGradients.length];
      const lastImg = p.tracks.filter(t => t.image).slice(-1)[0]?.image;
      return `<div class="playlist-card" data-id="${p.id}" style="animation-delay:${i * 0.07}s" role="button" tabindex="0">
        <div class="playlist-card-thumb">
          ${lastImg
            ? `<img class="thumb-art" src="${lastImg}" alt="${escapeHtml(p.name)}">`
            : `<div class="thumb-gradient" style="background:${grad}">
                <div class="thumb-music-icon">🎵</div>
              </div>`
          }
          <div class="thumb-overlay"></div>
          <div class="playlist-card-play">▶</div>
        </div>
        <div class="playlist-card-body">
          <div class="playlist-card-name">${escapeHtml(p.name)}</div>
          <div class="playlist-card-meta">
            <span>${p.tracks.length} faixa${p.tracks.length !== 1 ? 's' : ''}</span>
            ${p.tracks.length > 0 ? `<span class="sep">•</span><span>${p.tracks[0].artist ? escapeHtml(p.tracks[0].artist) : 'Várias'}</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');

    grid.querySelectorAll('.playlist-card').forEach(el => {
      el.addEventListener('click', () => openDetail(el.dataset.id));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openDetail(el.dataset.id); });
    });
  }

  function openDetail(id) {
    currentId = id;
    const pl = getPlaylists().find(p => p.id === id);
    if (!pl) return;

    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    document.getElementById('detailName').textContent = pl.name;
    document.getElementById('detailCount').textContent =
      pl.tracks.length ? `${pl.tracks.length} faixa${pl.tracks.length !== 1 ? 's' : ''} nesta playlist` : 'Sem faixas — use a busca para adicionar';
    document.getElementById('detailBadge').textContent = `${pl.tracks.length} faixas`;

    // Store playlist ID for search page redirect
    localStorage.setItem('sounad_active_playlist', id);

    renderTrackList(pl);
  }

  function renderTrackList(pl) {
    const tl = document.getElementById('trackList');
    if (!pl.tracks.length) {
      tl.innerHTML = `<div class="empty-state">
        <div class="pulse-ring">🎸</div>
        <strong>Nenhuma faixa ainda</strong>
        <p>Busque músicas pelo mood ou nome e adicione a esta playlist.</p>
        <a href="search.html" class="btn btn-primary">Buscar músicas</a>
      </div>`;
      return;
    }

    tl.innerHTML = pl.tracks.map((t, i) => `
      <div class="track-row" style="animation-delay:${i * 0.04}s" data-idx="${i}">
        <span class="track-num">${i + 1}</span>
        ${t.image
          ? `<img class="track-art" src="${t.image}" alt="${escapeHtml(t.title)}" loading="lazy">`
          : `<div class="track-art-placeholder">🎵</div>`
        }
        <div class="track-meta">
          <strong>${escapeHtml(t.title)}</strong>
          <span>${escapeHtml(t.artist)}${t.album ? ' · ' + escapeHtml(t.album) : ''}</span>
        </div>
        <div class="track-actions">
          ${t.previewUrl ? `<button class="play-btn" data-preview="${t.previewUrl}" data-idx="${i}" title="Pré-escuta" aria-label="Ouvir prévia">▶</button>` : ''}
          ${t.spotifyUrl ? `<a href="${t.spotifyUrl}" target="_blank" rel="noopener" class="btn btn-xs" style="background:rgba(29,185,84,.12);border:1px solid rgba(29,185,84,.3);color:#1DB954" title="Abrir no Spotify">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.36-.66.48-1.021.24-2.82-1.74-6.36-2.1-10.561-1.14-.418.12-.779-.18-.899-.54-.12-.42.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.479.66.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.02.6-1.14C9.6 9.9 15 10.56 18.72 12.84c.361.18.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.3c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.62.539.3.719 1.02.419 1.56-.299.42-1.02.6-1.559.3z"/></svg>
          </a>` : ''}
          <button class="btn btn-xs btn-danger" data-remove="${i}" title="Remover">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
          </button>
        </div>
      </div>`).join('');

    // Play buttons
    tl.querySelectorAll('button[data-preview]').forEach(btn => {
      btn.addEventListener('click', () => togglePlay(btn));
    });

    // Remove buttons
    tl.querySelectorAll('button[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.remove);
        if (confirm(`Remover "${escapeHtml(pl.tracks[idx].title)}" da playlist?`)) {
          removeTrack(currentId, idx);
          const updated = getPlaylists().find(p => p.id === currentId);
          renderTrackList(updated);
          document.getElementById('detailCount').textContent =
            updated.tracks.length
              ? `${updated.tracks.length} faixa${updated.tracks.length !== 1 ? 's' : ''} nesta playlist`
              : 'Sem faixas — use a busca para adicionar';
          document.getElementById('detailBadge').textContent = `${updated.tracks.length} faixas`;
          showToast('Faixa removida', 'success');
        }
      });
    });
  }

  function togglePlay(btn) {
    const url = btn.dataset.preview;
    if (currentAudio && !currentAudio.paused && btn.dataset.playing) {
      currentAudio.pause();
      btn.innerHTML = '▶';
      delete btn.dataset.playing;
      return;
    }
    if (currentAudio) {
      currentAudio.pause();
      document.querySelectorAll('.play-btn[data-playing]').forEach(b => {
        b.innerHTML = '▶'; delete b.dataset.playing;
      });
    }
    currentAudio = new Audio(url);
    currentAudio.play().catch(() => showToast('Prévia não disponível', 'error'));
    btn.innerHTML = '❚❚';
    btn.dataset.playing = '1';
    currentAudio.onended = () => { btn.innerHTML = '▶'; delete btn.dataset.playing; };
  }

  /* Back button */
  document.getElementById('backToList').addEventListener('click', e => {
    e.preventDefault();
    if (currentAudio) currentAudio.pause();
    localStorage.removeItem('sounad_active_playlist');
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    renderGrid();
  });

  /* Delete playlist */
  document.getElementById('deletePlaylistBtn').addEventListener('click', () => {
    const pl = getPlaylists().find(p => p.id === currentId);
    if (!pl) return;
    if (confirm(`Excluir a playlist "${pl.name}"? Esta ação não pode ser desfeita.`)) {
      deletePlaylist(currentId);
      document.getElementById('backToList').click();
      showToast('Playlist excluída', 'success');
    }
  });

  /* Create playlist */
  document.getElementById('newPlaylistForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('playlistName');
    const name = input.value.trim();
    if (!name) return;
    createPlaylist(name);
    input.value = '';
    document.getElementById('createForm').style.display = 'none';
    document.getElementById('openCreateBtn').style.display = 'inline-flex';
    renderGrid();
    showToast(`Playlist "${name}" criada!`, 'success');
  });

  /* Init */
  renderGrid();
</script>
</body>
</html>
